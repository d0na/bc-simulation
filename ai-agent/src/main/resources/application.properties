spring.application.name=ai-agent
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=sesame-ai-agent
spring.ai.mcp.client.version=0.0.1
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.type=SYNC

sesame.ai-agent.tool-names.simulation-launch=runSimulation
sesame.ai-agent.tool-names.etherscan-abi=getContractAbi
sesame.ai-agent.tool-names.etherscan-source-code=getContractSourceCode
sesame.ai-agent.tool-names.etherscan-address-metadata=getAddressMetadata
sesame.ai-agent.tool-names.dune-search-tables-by-contract=searchTablesByContractAddress
sesame.ai-agent.experiments-root=../experiments
