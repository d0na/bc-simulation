spring.application.name=ai-agent
server.port=8087

# OpenAI model access used by Spring AI.
spring.ai.openai.api-key=${OPENAI_API_KEY:PUT_YOUR_OPENAI_KEY_HERE}

spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=sesame-ai-agent-local
spring.ai.mcp.client.version=0.0.1
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.type=SYNC

# Sesame MCP is local.
spring.ai.mcp.client.streamable-http.connections.sesame.url=${SESAME_MCP_URL:http://localhost:8080}
spring.ai.mcp.client.streamable-http.connections.sesame.endpoint=/mcp

# Dune MCP is remote and supports api_key in the query string.
spring.ai.mcp.client.streamable-http.connections.dune.url=${DUNE_MCP_URL:https://api.dune.com}
spring.ai.mcp.client.streamable-http.connections.dune.endpoint=/mcp/v1?api_key=${DUNE_API_KEY:PUT_YOUR_DUNE_KEY_HERE}

# Etherscan MCP is remote and expects Authorization: Bearer <api-key>.
spring.ai.mcp.client.streamable-http.connections.etherscan.url=${ETHERSCAN_MCP_URL:https://mcp.etherscan.io}
spring.ai.mcp.client.streamable-http.connections.etherscan.endpoint=/mcp
sesame.ai-agent.etherscan-api-key=${ETHERSCAN_API_KEY:PUT_YOUR_ETHERSCAN_KEY_HERE}

# Tool names expected from the connected MCP servers.
sesame.ai-agent.tool-names.simulation-launch=runSimulation
sesame.ai-agent.tool-names.etherscan-abi=getContractAbi
sesame.ai-agent.tool-names.etherscan-source-code=getContractSourceCode
sesame.ai-agent.tool-names.etherscan-address-metadata=getAddressMetadata
sesame.ai-agent.tool-names.dune-search-tables-by-contract=searchTablesByContractAddress

# Running examples live in the repo-level experiments directory.
sesame.ai-agent.experiments-root=../experiments
